<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Flask with Vue.js</title>
</head>
<body>
    <div id="app">
       
        <div v-if="!role && isLoginVisible">
            <h2>[[ message ]]</h2>
            <button @click="showLoginForm">Login</button>
            <button @click="showRegisterForm">Register</button>
        </div>

        <div v-if="isLoginVisible">
            <h2>Login</h2>
            <form @submit.prevent="handleLogin">
                <div>
                    <label for="login-username">Username:</label>
                    <input type="text" id="login-username" v-model="loginUsername" required>
                </div>
                <div>
                    <label for="login-password">Password:</label>
                    <input type="password" id="login-password" v-model="loginPassword" required>
                </div>
                <p v-if="loginError" class="error">[[ loginError ]]</p>
                <button type="submit">Login</button>
            </form>
            <p>Don't have an account? <button @click="showRegisterForm">Create New Account</button></p>
        </div>

        <div v-if="isRegisterVisible">
            <h2>Register</h2>
            <form @submit.prevent="handleRegister">
                <div>
                    <label for="register-email">Email:</label>
                    <input type="email" id="register-email" v-model="registerEmail" required>
                </div>
                
                <div>
                    <label for="register-username">Username:</label>
                    <input type="text" id="register-username" v-model="registerUsername" required>
                </div>
                <div>
                    <label for="register-password">Password:</label>
                    <input type="password" id="register-password" v-model="registerPassword" required>
                </div>
                <div>
                    <label for="register-role">Role:</label>
                    <select id="register-role" v-model="selectedRole" required>
                        <option value="influencer">Influencer</option>
                        <option value="sponsor">Sponsor</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <p v-if="registerError" class="error">[[ registerError ]]</p>
                <p v-if="registerSuccess" class="success">[[ registerSuccess ]]</p>
                <button type="submit" :disabled="isLoading">Register</button>
            </form>
            <p>Already have an account? <button @click="showLoginForm">Login</button></p>
        </div>

        <admin-dashboard v-if="role === 'admin'"></admin-dashboard>
        <sponsor-dashboard v-if="role === 'sponsor'"></sponsor-dashboard>
        <influencer-dashboard v-if="role === 'influencer'"></influencer-dashboard>

       
        <p v-if="!role && !isLoading">Please log in to access the platform.</p>

        
    </div>

    <script type="text/x-template" id="admin-dashboard">
        <div>
            <h1>Welcome to Admin Dashboard</h1>
            <p>Manage platform-wide operations here.</p>
            <button @click="logout" class="btn btn-danger mt-2">Logout</button>
    
            <p v-if="error" class="text-danger">[[ error ]]</p>

            <div>
                <h3>Sponsor waiting for approval</h3>
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Approval</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="sponsor in sponsors" :key="sponsor.id">
                            <td>[[ sponsor.id ]]</td>
                            <td>[[ sponsor.name ]]</td>
                            <td>[[ sponsor.email ]]</td>
                            <td>
                                <button 
                                    class="btn btn-primary btn-sm"
                                    @click="approveSponsor(sponsor.id)">
                                    Approve
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
    
            <h2>Active Users</h2>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="user in users" :key="user.id">
                        <td>[[ user.id ]]</td>
                        <td>[[ user.name ]]</td>
                        <td>[[ user.role ]]</td>
                        <td>
                            <button 
                                class="btn btn-danger btn-sm"
                                @click="deleteUser(user.id)">
                                Flag
                            </button>
                        </td>
                    </tr>
                    <tr v-if="users.length === 0">
                        <td colspan="3" class="text-center">No users found</td>
                    </tr>
                </tbody>
            </table>
    
            <h2>Campaigns</h2>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Visibility</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Budget</th>
                        <th>Goals</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="campaign in campaigns" :key="campaign.id">
                        <td>[[ campaign.id ]]</td>
                        <td>[[ campaign.name ]]</td>
                        <td>[[ campaign.visibility ]]</td>
                        <td>[[ campaign.start_date ]]</td>
                        <td>[[ campaign.end_date ]]</td>
                        <td>[[ campaign.budget ]]</td>
                        <td>[[ campaign.goals ]]</td>
                        <td>
                            <button 
                                class="btn btn-danger btn-sm"
                                @click="deleteCampaign(campaign.id)">
                                Flag
                            </button>
                        </td>
                    </tr>
                    <tr v-if="campaigns.length === 0">
                        <td colspan="7" class="text-center">No campaigns found</td>
                    </tr>
                </tbody>
            </table>
    
            <h2>Ad Requests</h2>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Requirements</th>
                        <th>Payment Amount</th>
                        <th>Status</th>
                        <th>Campaign</th>
                        <th>Influencer</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="adRequest in adRequests" :key="adRequest.id">
                        <td>[[ adRequest.id ]]</td>
                        <td>[[ adRequest.requirements ]]</td>
                        <td>[[ adRequest.payment_amount ]]</td>
                        <td>[[ adRequest.status ]]</td>
                        <td>[[ adRequest.campaign.name ]]</td>
                        <td>[[ adRequest.influencer.name ]]</td>
                        <td>
                            <button 
                                class="btn btn-danger btn-sm"
                                @click="deleteAdRequest(adRequest.id)">
                                Delete
                            </button>
                        </td>
                    </tr>
                    <tr v-if="adRequests.length === 0">
                        <td colspan="6" class="text-center">No ad requests found</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </script>  
    
    

    <script type="text/x-template" id="sponsor-dashboard">
        <div>
            <h1>Welcome, Sponsor [[ user ]]!</h1>
            <button @click="logout" class="btn btn-danger">Logout</button>
            <button @click="trigger_celery_job" class="btn btn-danger">Trigger celery job</button>
            
            <h2>Search Influencers</h2>
            <form @submit.prevent="searchInfluencers">
                <input v-model="searchQuery" type="text" placeholder="Search Influencers by Name" class="form-control">
                <button type="submit" class="btn btn-primary mt-2">Search</button>
            </form>
            <p v-if="searchError" class="text-danger">[[ searchError ]]</p>
            <ul v-if="searchResults.length > 0">
                <li v-for="influencer in searchResults" :key="influencer.id">
                    [[ influencer.name ]]
                </li>
            </ul>
            <p v-else-if="searchQuery && searchResults.length === 0">No influencers found.</p>
    
            <h2>Your Campaigns</h2>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Budget</th>
                        <th>Visibility</th>
                        <th>Goals</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="campaign in campaigns" :key="campaign.id">
                        <td>[[ campaign.name ]]</td>
                        <td>[[ campaign.description ]]</td>
                        <td>[[ campaign.start_date ]]</td>
                        <td>[[ campaign.end_date ]]</td>
                        <td>[[ campaign.budget ]]</td>
                        <td>[[ campaign.visibility ]]</td>
                        <td>[[ campaign.goals ]]</td>
                        <td>
                            <button class="btn btn-warning btn-sm" @click="editCampaign(campaign)">Update</button>
                            <button class="btn btn-danger btn-sm" @click="deleteCampaign(campaign.id)">Delete</button>
                        </td>
                    </tr>
                    <tr v-if="campaigns.length === 0">
                        <td colspan="7" class="text-center">No campaigns found</td>
                    </tr>
                </tbody>
            </table>

            <h2>Ad Requests</h2>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Campaign</th>
                        <th>Influencer</th>
                        <th>Requirements</th>
                        <th>Payment Amount</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="adRequest in adRequests" :key="adRequest.id">
                        <td>[[ adRequest.campaign_id ]]</td>
                        <td>[[ adRequest.influencer_id ]]</td>
                        <td>[[ adRequest.requirements ]]</td>
                        <td>[[ adRequest.payment_amount ]]</td>
                        <td>[[ adRequest.status ]]</td>
                        <td>
                            <button class="btn btn-warning btn-sm" @click="editAdRequest(adRequest)">Update</button>
                            <button class="btn btn-danger btn-sm" @click="deleteAdRequest(adRequest.id)">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div v-if="editingCampaignId" class="mt-4">
                <h2>Edit Campaign</h2>
                <form @submit.prevent="saveCampaign">
                    <div class="form-group">
                        <label for="name">Campaign Name:</label>
                        <input v-model="newCampaign.name" type="text" id="name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description:</label>
                        <textarea v-model="newCampaign.description" id="description" class="form-control"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="start_date">Start Date:</label>
                        <input v-model="newCampaign.start_date" type="date" id="start_date" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="end_date">End Date:</label>
                        <input v-model="newCampaign.end_date" type="date" id="end_date" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="budget">Budget:</label>
                        <input v-model="newCampaign.budget" type="number" id="budget" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="visibility">Visibility:</label>
                        <select v-model="newCampaign.visibility" id="visibility" class="form-control">
                            <option value="public">Public</option>
                            <option value="private">Private</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="goals">Goals:</label>
                        <textarea v-model="newCampaign.goals" id="goals" class="form-control"></textarea>
                    </div>
                    <button @click="updateCampaign(campaign.id, updatedCampaignData)" class="btn btn-primary">
                        Save Changes
                    </button>
                    <button type="button" class="btn btn-secondary" @click="editingCampaignId = null">Cancel</button>
                </form>
            </div>
            
            <div v-if="editingAdRequestId" class="mt-4">
                <h2>Edit Ad Request</h2>
                <form @submit.prevent="saveAdRequest">
                    <div class="form-group">
                        <label for="campaign_id">Campaign ID:</label>
                        <input v-model="newAdRequest.campaign_id" type="number" id="campaign_id" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="influencer_id">Influencer ID:</label>
                        <input v-model="newAdRequest.influencer_id" type="number" id="influencer_id" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="requirements">Requirements:</label>
                        <textarea v-model="newAdRequest.requirements" id="requirements" class="form-control"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="payment_amount">Payment Amount:</label>
                        <input v-model="newAdRequest.payment_amount" type="number" id="payment_amount" class="form-control" required>
                    </div>
                    <button @click="updateAdRequest(adRequest.id, updatedAdRequestData)" class="btn btn-primary">
                        Save Changes
                    </button>
                    <button type="button" class="btn btn-secondary" @click="editingAdRequestId = null">Cancel</button>
                </form>
            </div>
            
            <h2>Create a New Campaign</h2>
            <form @submit.prevent="createCampaign">
                <div class="form-group">
                    <label for="name">Campaign Name:</label>
                    <input v-model="newCampaign.name" type="text" id="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea v-model="newCampaign.description" id="description" class="form-control"></textarea>
                </div>
                <div class="form-group">
                    <label for="start_date">Start Date:</label>
                    <input v-model="newCampaign.start_date" type="date" id="start_date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="end_date">End Date:</label>
                    <input v-model="newCampaign.end_date" type="date" id="end_date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="budget">Budget:</label>
                    <input v-model="newCampaign.budget" type="number" id="budget" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="visibility">Visibility:</label>
                    <select v-model="newCampaign.visibility" id="visibility" class="form-control">
                        <option value="public">Public</option>
                        <option value="private">Private</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="goals">Goals:</label>
                    <textarea v-model="newCampaign.goals" id="goals" class="form-control"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Create Campaign</button>
            </form>
            <p v-if="flashMessage" class="text-success mt-2">[[ flashMessage ]]</p>

            <h2>Create a New Ad Request</h2>
            <form @submit.prevent="createAdRequest">
                <div class="form-group">
                    <label for="campaign">Campaign:</label>
                    <select v-model="newAdRequest.campaign_id" id="campaign" class="form-control" required>
                        <option v-for="campaign in campaigns" :value="campaign.id" :key="campaign.id">
                            [[ campaign.name ]]
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="influencer">Influencer:</label>
                    <select v-model="newAdRequest.influencer_id" id="influencer" class="form-control" required>
                        <option v-for="influencer in influencers" :value="influencer.id" :key="influencer.id">
                            [[ influencer.name ]]
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="requirements">Requirements:</label>
                    <textarea v-model="newAdRequest.requirements" id="requirements" class="form-control" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="payment_amount">Payment Amount:</label>
                    <input v-model="newAdRequest.payment_amount" type="number" id="payment_amount" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary">Create Ad Request</button>
            </form>

            <p v-if="flashMessage" class="text-success mt-2">[[ flashMessage ]]</p>



        </div>
    </script>
    

    <script type="text/x-template" id="influencer-dashboard">
        <div>
            <h1>Welcome, Influencer [[ user ]]!</h1>
            <button @click="logout" class="btn btn-danger">Logout</button>
    
            <h2>Your Ad Requests</h2>
            <div v-if="adRequests.length">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Campaign Name</th>
                            <th>Requirements</th>
                            <th>Payment Amount</th>
                            <th>Status</th>
                            <th>Messages</th>
                            <th>Actions</th> 
                        </tr> 
                    </thead>
                    <tbody>
                        <tr v-for="request in adRequests" :key="request.id">
                            <td>[[ request.campaign.name ]]</td>
                            <td>[[ request.requirements ]]</td>
                            <td>[[ request.payment_amount.toFixed(2) ]]</td>
                            <td>[[ request.status ]]</td>
                            <td>[[ request.messages ]]</td>
                            <td>
                                <button 
                                    class="btn btn-success btn-sm"
                                    @click="updateAdRequestStatus(request.id, 'Accepted')"
                                    :disabled="request.status !== 'Pending'"
                                >
                                    Accept
                                </button>
                                <button 
                                    class="btn btn-danger btn-sm"
                                    @click="updateAdRequestStatus(request.id, 'Rejected')"
                                    :disabled="request.status !== 'Pending'"
                                >
                                    Reject
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div v-else>
                <p>No ad requests have been created for you yet.</p>
            </div>
    
            <h2>Search Public Campaigns</h2>
            <div>
                <input 
                    v-model="searchQuery.name" 
                    type="text" 
                    placeholder="Search by name" 
                    class="form-control mb-2" 
                />
                <input 
                    v-model="searchQuery.budget" 
                    type="number" 
                    placeholder="Search by budget" 
                    class="form-control mb-2" 
                />
                <button @click="searchPublicCampaigns" class="btn btn-primary">Search</button>
            </div>
    
            <h3 v-if="searchResults.length">Search Results</h3>
            <div v-if="searchResults.length">
                <table class="table mt-3">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Budget</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="campaign in searchResults" :key="campaign.id">
                            <td>[[ campaign.name ]]</td>
                            <td>[[ campaign.description ]]</td>
                            <td>[[ campaign.budget ]]</td>
                            <td>[[ new Date(campaign.start_date).toLocaleDateString() ]]</td>
                            <td>[[ new Date(campaign.end_date).toLocaleDateString() ]]</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p v-else>No campaigns found for the given search criteria.</p>
        </div>
    </script>
    

    <!-- Include Vue.js and Axios -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Link to Your App's JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
